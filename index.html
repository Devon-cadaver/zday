<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>My Little Disaster</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cellipse cx='50' cy='44' rx='18' ry='16' fill='%23bfe9ff'/%3E%3Cellipse cx='50' cy='58' rx='46' ry='13' fill='%239aa1b3'/%3E%3Ccircle cx='24' cy='60' r='5' fill='%23ff4fa3'/%3E%3Ccircle cx='50' cy='64' r='5' fill='%23ff4fa3'/%3E%3Ccircle cx='76' cy='60' r='5' fill='%23ff4fa3'/%3E%3C/svg%3E">
<script>try { if (sessionStorage.getItem('zd_sky')) document.documentElement.className = 'sky'; } catch (e) {}</script>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}
html.sky,html.sky body{background:#e9eef3}
#zd-loading{position:fixed;left:0;right:0;top:42%;text-align:center;color:#f4eee4;font:900 30px/1 Impact,'Arial Black',sans-serif;letter-spacing:.04em;text-shadow:2px 2px 0 #7a0d12,0 0 18px rgba(255,79,163,.6);pointer-events:none}
#zd-loading small{display:block;margin-top:12px;font:700 13px system-ui,sans-serif;letter-spacing:.12em;color:#ffd6ef;text-shadow:0 0 10px rgba(255,79,163,.7)}
html.sky #zd-loading{display:none}
#hud{position:fixed;left:10px;top:calc(8px + env(safe-area-inset-top));color:#f6e7cc;font:12px/1.35 system-ui,sans-serif;text-shadow:0 1px 2px #000;pointer-events:none;opacity:.85}
</style>
</head>
<body>
<div id="zd-loading">MY LITTLE DISASTER<small>LOADING...</small></div>
<div id="hud"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
