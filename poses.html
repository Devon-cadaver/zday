<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>My Little Disaster · Pose Lab</title>
<style>
html,body{margin:0;height:100%;background:#14182a;color:#eef2ff;font:14px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#app{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
button,select,a.b{appearance:none;-webkit-appearance:none;min-height:44px;border:1px solid rgba(255,255,255,.22);border-radius:10px;background:#2a3150;color:#eef2ff;font:700 13px system-ui,-apple-system,sans-serif;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:active{background:#46507d}button.on{background:#ffd36b;color:#2a1c00;border-color:#ffd36b}button:disabled{opacity:.4}
#top{display:flex;gap:6px;padding:6px 8px;flex:none}
#top #mv{flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;justify-content:flex-start;background:#3a2a66}
#main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#view{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;touch-action:none;background:#1b2038}
#view canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#dots{pointer-events:none}
#say{position:absolute;left:8px;right:8px;top:8px;text-align:center;font-weight:800;font-size:13px;text-shadow:0 1px 3px #000;pointer-events:none;opacity:0;transition:opacity .2s}
#cams{position:absolute;right:6px;bottom:6px;display:flex;gap:4px}
#cams button{min-height:36px;padding:0 8px;font-size:11px;background:rgba(20,24,42,.8)}
#who{position:absolute;left:6px;bottom:6px;display:flex;gap:4px}
#who button{min-height:36px;padding:0 10px;font-size:12px;background:rgba(20,24,42,.8)}#who button.on{background:#ffd36b}
#side{flex:none;display:flex;flex-direction:column;min-height:0;background:#181d33;border-top:1px solid rgba(255,255,255,.14);padding-bottom:env(safe-area-inset-bottom)}
#time{flex:none;padding:6px 10px 4px}
#track{position:relative;height:38px;touch-action:none;cursor:pointer}
#track .ln{position:absolute;left:0;right:0;top:17px;height:4px;border-radius:2px;background:rgba(255,255,255,.22)}
#track .k{position:absolute;top:9px;width:14px;height:20px;margin-left:-7px;border-radius:4px;background:#8fb8ff}#track .k.at{background:#ffd36b}#track .k.pin{box-shadow:0 0 0 2px #ff7ad9}
#track .hit{position:absolute;top:2px;width:0;height:0;margin-left:-6px;border:6px solid transparent;border-top:8px solid #ff5a4a}
#track .now{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;pointer-events:none}
#read{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:#b9c3e6}
#trans{display:flex;gap:4px;margin-top:3px}#trans button{flex:1 1 0;min-width:0;padding:0 2px}#trans #play{flex:1.6 1 0;background:#2f7a4e}
#tabs{flex:none;display:flex;gap:4px;padding:4px 10px}#tabs button{flex:1 1 0;min-height:36px;padding:0 4px}
#panel{height:30vh;min-height:170px;max-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 10px 10px}
.t{font-weight:800;margin:6px 0 4px}.t small{font-weight:600;color:#b9c3e6}.help{font-size:12px;color:#b9c3e6;margin:4px 0}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.row>button,.row>a.b{flex:1 1 auto}
.sl{display:grid;grid-template-columns:76px 1fr 42px;align-items:center;gap:6px;min-height:40px;font-size:12px;font-weight:700}
.sl input{width:100%;height:36px;margin:0;touch-action:none}.sl output{text-align:right;color:#b9c3e6;font-weight:600}
.chip{min-height:38px;padding:0 9px;font-size:12px}
#sheet{position:fixed;left:0;top:0;right:0;bottom:0;background:#14182a;z-index:9;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
#sheet.show{display:flex}#sheet .h{display:flex;align-items:center;gap:8px;padding:8px}#sheet .h b{flex:1;font-size:15px}
#list{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 8px calc(16px + env(safe-area-inset-bottom))}
#list h3{margin:12px 2px 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#b9c3e6}
#list .g{display:grid;grid-template-columns:1fr 1fr;gap:6px}#list button{text-align:left;justify-content:flex-start;padding:6px 10px;font-size:12px}
#list button i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffd36b;margin-right:6px;flex:none}
textarea{width:100%;height:96px;background:#0d1020;color:#d9e2ff;border:1px solid rgba(255,255,255,.2);border-radius:8px;font:11px ui-monospace,Menlo,monospace;padding:6px}
#load{position:absolute;left:0;right:0;top:45%;text-align:center;font-weight:800;color:#b9c3e6}
@media (orientation:landscape) and (max-height:560px){#main{flex-direction:row}#side{width:350px;border-top:0;border-left:1px solid rgba(255,255,255,.14);padding-right:env(safe-area-inset-right)}#panel{flex:1 1 auto;height:auto;min-height:0;max-height:none}}
@media (min-width:900px){#main{flex-direction:row}#side{width:380px;border-top:0;border-left:1px solid rgba(255,255,255,.14)}#panel{flex:1 1 auto;height:auto;min-height:0;max-height:none}}
</style>
</head>
<body>
<div id="app">
  <div id="top"><a class="b" href="./index.html">Back</a><button id="mv" type="button">Neck drag</button><button id="undo" type="button" disabled>Undo</button></div>
  <div id="main">
    <div id="view"><canvas id="gl"></canvas><canvas id="dots"></canvas><div id="load">Setting the stage...</div><div id="say"></div>
      <div id="who"></div>
      <div id="cams"><button type="button" data-cam="front">Front</button><button type="button" data-cam="side">Side</button><button type="button" data-cam="top">Top</button><button type="button" id="cape">Cape</button><button type="button" id="hide">Dots</button></div>
    </div>
    <div id="side">
      <div id="time"><div id="read"><span id="rt"></span><span id="rk"></span></div><div id="track"></div>
        <div id="trans"><button type="button" id="kp" aria-label="Previous key">&laquo; Key</button><button type="button" id="fp" aria-label="Back one frame">&lsaquo;</button><button type="button" id="play">Play</button><button type="button" id="fn" aria-label="On one frame">&rsaquo;</button><button type="button" id="kn" aria-label="Next key">Key &raquo;</button><button type="button" id="spd">1x</button></div></div>
      <div id="tabs"><button type="button" data-tab="pose">Pose</button><button type="button" data-tab="keys">Timing</button><button type="button" data-tab="stage">Stage</button><button type="button" data-tab="save">Save</button></div>
      <div id="panel"></div>
    </div>
  </div>
</div>
<div id="sheet"><div class="h"><b>Pick a move</b><button type="button" id="closeS">Close</button></div><div id="list"></div></div>
<script type="module" src="/src/poselab.js"></script>
</body>
</html>
