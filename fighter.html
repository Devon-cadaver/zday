<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Little Disaster · look test</title>
<style>
html,body{margin:0;height:100%;background:#141a33;color:#f4f0e8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#top{position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none;font-size:13px;text-shadow:0 1px 3px #000}
#top a{pointer-events:auto;color:#fff;background:rgba(0,0,0,.5);padding:9px 12px;border-radius:9px;text-decoration:none;font-weight:700}
#fps{background:rgba(0,0,0,.5);padding:6px 9px;border-radius:8px;font-variant-numeric:tabular-nums}
#ctl{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:5px}
.row button{flex:1;min-height:42px;border:1px solid rgba(255,255,255,.28);border-radius:9px;background:rgba(10,12,24,.74);color:#fff;font:700 13px system-ui,sans-serif}
.row button.on{background:#a87e42;border-color:#ffdca0}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="top"><a href="./">&lsaquo; Back</a><span id="fps">measuring</span></div>
<div id="ctl"><div class="row" id="bShow"></div><div class="row" id="bView"></div><div class="row" id="bMove"></div><div class="row" id="bLight"></div></div>
<script type="module" src="/src/lookpage.js"></script>
</body>
</html>
