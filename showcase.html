<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Little Disaster · roster</title>
<style>
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 40%,#2a2016,#120d08);color:#f6ead2;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
/* the tiles are drawn into one canvas over the panel, clipped to the scrolling list; the header and labels sit on top of it */
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;box-sizing:border-box;
  padding:max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left))}
.box{position:relative;width:100%;max-width:640px;max-height:100%;height:100%;display:flex;flex-direction:column;background:rgba(32,24,14,.94);border:1px solid rgba(255,236,200,.18);border-radius:16px;overflow:hidden}
.mhead{position:relative;z-index:3;display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid rgba(255,236,200,.14);flex:none;background:rgb(30,23,14)}
.back{appearance:none;border:1px solid rgba(255,236,200,.18);background:rgba(28,20,12,.72);color:#f6ead2;border-radius:10px;font:700 12px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:9px 12px;text-decoration:none;flex:none}
.mt{flex:1;font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#fff4e0}
.mbody{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 12px 18px;min-height:0;flex:1 1 auto}
h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#d8c49e;margin:16px 0 8px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:rgba(255,236,200,.18)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:7px}
.tile{aspect-ratio:1/1;position:relative;border-radius:9px;background:rgba(255,236,200,.04);border:1px solid rgba(255,236,200,.08)}
.tile .lbl{position:absolute;z-index:3;left:50%;bottom:5px;transform:translateX(-50%);max-width:92%;box-sizing:border-box;text-align:center;background:rgba(28,20,12,.88);border:1px solid rgba(255,236,200,.2);color:#f6ead2;padding:3px 6px;border-radius:5px;font:700 8.5px/1.15 system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <div class="box">
    <div class="mhead"><a class="back" href="./">&lsaquo; Back</a><div class="mt">Roster</div></div>
    <div class="mbody" id="list"><div id="sections"></div></div>
  </div>
</div>
<script type="module" src="/src/showcase.js"></script>
</body>
</html>
